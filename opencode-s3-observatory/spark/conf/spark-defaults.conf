# Shared Spark settings. Iceberg is the transactional analytical source.
spark.sql.extensions                                  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.opencode                             org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.opencode.type                        rest
spark.sql.catalog.opencode.uri                         http://iceberg:8181
spark.sql.catalog.opencode.warehouse                   s3a://bigdata/iceberg/
spark.sql.catalog.opencode.io-impl                     org.apache.iceberg.hadoop.HadoopFileIO
spark.sql.catalog.opencode.default-namespace           opencode
spark.hadoop.fs.s3a.endpoint                           http://s3:8333
spark.hadoop.fs.s3a.access.key                         admin
spark.hadoop.fs.s3a.secret.key                         bigdata-local-secret
spark.hadoop.fs.s3a.path.style.access                  true
spark.hadoop.fs.s3a.connection.ssl.enabled             false
spark.hadoop.fs.s3a.impl                               org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3.impl                                org.apache.hadoop.fs.s3a.S3AFileSystem
