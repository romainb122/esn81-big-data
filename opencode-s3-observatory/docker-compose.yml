name: esn81-big-data

services:
  s3:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8333:8333"
    environment:
      # Identifiants de demonstration pour un usage local.
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: bigdata-local-secret
      S3_BUCKET: bigdata
    volumes:
      - s3-data:/data

  iceberg:
    image: tabulario/iceberg-rest:1.6.0
    user: "0:0"
    restart: unless-stopped
    depends_on:
      - s3
    ports:
      - "127.0.0.1:8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: bigdata-local-secret
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://bigdata/iceberg/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://s3:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:/var/lib/iceberg/catalog.db
    volumes:
      - iceberg-catalog-data:/var/lib/iceberg

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    restart: unless-stopped
    depends_on:
      - s3
      - iceberg
      - spark-query
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: bigdata
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: bigdata-local-secret
      AWS_REGION: us-east-1
      S3_PREFIX: opencode-conversations/sessions/
      ICEBERG_URI: http://iceberg:8181
      SPARK_QUERY_URL: http://spark-query:4041

  documentation:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8502:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro

  spark-query:
    image: esn81-big-data-spark:local
    build:
      context: .
      dockerfile: Dockerfile.spark
    restart: unless-stopped
    depends_on:
      - s3
      - iceberg
    volumes:
      - ./spark/jobs:/opt/spark-apps:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - /opt/spark-apps/query_server.py
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4041/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  spark-batch:
    image: esn81-big-data-spark:local
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["spark"]
    depends_on:
      - s3
      - iceberg
    volumes:
      - ./spark/jobs:/opt/spark-apps:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - /opt/spark-apps/session_summary.py

volumes:
  s3-data:
    name: esn81-big-data_s3-data
  iceberg-catalog-data:
    name: esn81-big-data_iceberg-catalog-data
