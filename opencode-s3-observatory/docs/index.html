<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Documentation de OpenCode S3 Observatory">
    <title>OpenCode S3 Observatory</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
    <link rel="stylesheet" href="assets/docsify.css">
  </head>
  <body>
    <div id="app">Chargement de la documentation...</div>
    <script>
      window.$docsify = {
        name: "OpenCode S3 Observatory",
        homepage: "README.md",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        coverpage: true,
        search: {
          placeholder: "Rechercher",
          noData: "Aucun resultat",
          depth: 4
        },
        copyCode: {
          buttonText: "Copier",
          errorText: "Erreur",
          successText: "Copie"
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  </body>
</html>
