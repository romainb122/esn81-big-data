<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Documentation de Conversation Observatory">
    <title>Conversation Observatory</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <link rel="stylesheet" href="assets/docsify.css">
  </head>
  <body>
    <div id="app">Chargement de la documentation...</div>
    <script>
      window.$docsify = {
        name: "Conversation Observatory",
        homepage: "README.md",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        coverpage: true,
        search: {
          placeholder: "Rechercher",
          noData: "Aucun resultat",
          depth: 4
        },
        copyCode: {
          buttonText: "Copier",
          errorText: "Erreur",
          successText: "Copie"
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script>
      mermaid.initialize({
        startOnLoad: false,
        theme: "base",
        themeVariables: {
          primaryColor: "#dff3ef",
          primaryTextColor: "#173b3a",
          primaryBorderColor: "#2c7a72",
          lineColor: "#5b6b7c",
          secondaryColor: "#e8f0fb",
          tertiaryColor: "#fff8e6",
          clusterBkg: "#f8fafc",
          clusterBorder: "#cbd5e1",
          fontFamily: "Inter, ui-sans-serif, system-ui, sans-serif"
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  </body>
</html>
